name: Rust

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --doc
      - run: python scripts/check_workshop.py
      - run: python scripts/check_catalogue.py
      - run: cargo build --locked
      - run: python -m pip install -r workshop/pdf-requirements.txt
      - run: python scripts/build_workbook.py
      - run: python scripts/check_workbook.py
