name: Windows release package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install -r workshop/pdf-requirements.txt
      - run: python scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: DIVULGE-windows-release
          path: output/release/*
          if-no-files-found: error
